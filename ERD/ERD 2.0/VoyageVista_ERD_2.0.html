<style>
/* Layout: werkbalk bovenaan, tekenvel (pan/zoom) links, detailpaneel rechts; op telefoon onder elkaar. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sheet: #ffffff; --fg: #0f1a2b; --muted: #5a6779;
  --line: #d9dfe7; --accent: #1f5fd1; --accent-soft: #e6eefc; --chip: #eef1f5;
  --ui: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d131c; --surface: #151d29; --sheet: #ffffff; --fg: #e6ebf2; --muted: #93a0b2;
  --line: #273243; --accent: #6b9cf5; --accent-soft: #1c2b45; --chip: #1e2836; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d131c; --surface: #151d29; --sheet: #ffffff; --fg: #e6ebf2; --muted: #93a0b2;
  --line: #273243; --accent: #6b9cf5; --accent-soft: #1c2b45; --chip: #1e2836; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; display: flex; flex-direction: column; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 14px 0; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; justify-content: space-between; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 8px; }
.meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
.search { display: flex; gap: 6px; align-items: center; }
.search input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 220px; max-width: 60vw; }
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
nav { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: thin; }
nav button { font: inherit; font-weight: 500; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 12px 9px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
nav button i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
nav button:hover { color: var(--fg); }
nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.stage { position: relative; min-height: 420px; overflow: hidden; background: var(--sheet); cursor: grab; touch-action: none; }
.stage.dragging { cursor: grabbing; }
.stage svg.view { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage .view { display: none; } .stage .view.on { display: block; }
.tools { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; gap: 6px; z-index: 2; }
.tools button, .btn { font: inherit; font-size: 13px; font-weight: 500; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px; cursor: pointer; }
.tools button:hover, .btn:hover { border-color: var(--accent); }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: rgba(255,255,255,.94); border: 1px solid #dde3ea; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #334155; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: calc(100% - 200px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.hint { position: absolute; left: 12px; top: 10px; z-index: 2; font-size: 12px; color: #5a6779; background: rgba(255,255,255,.9); padding: 3px 8px; border-radius: 5px; }
/* markering */
.stage.focus .rel { opacity: .07; }
.stage.focus .tbl { opacity: .28; transition: opacity .15s; }
.stage.focus .rel.hl { opacity: 1; stroke-width: 2.6; }
.stage.focus .tbl.hl { opacity: 1; }
.stage .tbl { cursor: pointer; }
.stage .tbl.sel > rect:nth-of-type(2) { stroke: #0f172a; stroke-width: 2.4; }
@media (prefers-reduced-motion: reduce) { .stage.focus .tbl { transition: none; } }
aside { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding-block: 18px 28px; }
aside h2 { font-size: 18px; margin: 0 0 4px; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
aside p { margin: 0 0 8px; line-height: 1.5; color: var(--fg); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--chip); border-radius: 999px; padding: 3px 10px 3px 8px; color: var(--fg); }
.chip i { width: 8px; height: 8px; border-radius: 2px; }
table.attrs { width: 100%; border-collapse: collapse; font-size: 13px; }
table.attrs td { padding: 5px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.attrs td:first-child { font-family: var(--mono); font-size: 12.5px; }
table.attrs td.t { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.k { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 3px; padding: 1px 4px; margin-right: 3px; font-family: var(--ui); }
.k.pk { background: #fef3c7; color: #92400e; } .k.fk { background: #e0e7ff; color: #3730a3; } .k.u { background: #dcfce7; color: #166534; } .k.n { color: var(--muted); }
.d { color: var(--muted); font-size: 12px; font-family: var(--ui); }
ul.rels, ol.changes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.rels li { font-size: 13px; line-height: 1.45; padding: 7px 9px; background: var(--bg); border-radius: 6px; }
ul.rels .card { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
a.t { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
a.t:hover { text-decoration: underline; }
ol.changes { counter-reset: c; }
ol.changes li { counter-increment: c; position: relative; padding-left: 30px; line-height: 1.5; font-size: 13.5px; }
ol.changes li::before { content: counter(c); position: absolute; left: 0; top: 1px; width: 21px; height: 21px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
code { font-family: var(--mono); font-size: 12.5px; background: var(--chip); padding: 0 4px; border-radius: 3px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stats div { background: var(--bg); border-radius: 8px; padding: 10px; }
.stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.domains { display: grid; gap: 4px; }
.domains button { font: inherit; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; color: var(--fg); cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.domains button:hover { background: var(--bg); }
.domains .n { color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .legend { display: none; }
  body { height: auto; }
}
</style>

function svgOf(v) { return stage.querySelector(`svg.view[data-v="${v}"]`); }
function apply(v) { const s = svgOf(v), t = tf[v]; s.style.transform = `translate(${t.x}px,${t.y}px) scale(${t.k})`; }
function fit(v) {
  const s = svgOf(v), W = +s.getAttribute('width'), H = +s.getAttribute('height');
  const r = stage.getBoundingClientRect();
  const k = Math.min((r.width - 24) / W, (r.height - 70) / H, 1.2);
  tf[v] = { k, x: (r.width - W * k) / 2, y: Math.max(36, (r.height - H * k) / 2) };
  apply(v);
}
function zoomAt(f, cx, cy) {
  const t = tf[view], k = Math.min(3, Math.max(0.08, t.k * f));
  t.x = cx - (cx - t.x) * (k / t.k); t.y = cy - (cy - t.y) * (k / t.k); t.k = k; apply(view);
}

function show(v, keepSel) {
  view = v;
  stage.querySelectorAll('svg.view').forEach(s => s.classList.toggle('on', s.dataset.v === v));
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  if (!tf[v]) fit(v);
  if (!keepSel) select(null);
  else highlight();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}

function highlight() {
  stage.classList.toggle('focus', !!selected);
  stage.querySelectorAll('.hl,.sel').forEach(e => e.classList.remove('hl', 'sel'));
  if (!selected) return;
  const s = svgOf(view);
  const near = new Set([selected]);
  s.querySelectorAll('.rel').forEach(p => {
    if (p.dataset.a === selected || p.dataset.b === selected) { p.classList.add('hl'); near.add(p.dataset.a); near.add(p.dataset.b); }
  });
  s.querySelectorAll('.tbl').forEach(g => { if (near.has(g.dataset.name)) g.classList.add('hl'); if (g.dataset.name === selected) g.classList.add('sel'); });
}

function centerOn(name) {
  const g = svgOf(view).querySelector(`.tbl[data-name="${name}"]`);
  if (!g) return;
  const b = g.getBBox(), r = stage.getBoundingClientRect(), t = tf[view];
  t.k = Math.max(t.k, 0.75);
  t.x = r.width / 2 - (b.x + b.width / 2) * t.k; t.y = r.height / 2 - (b.y + b.height / 2) * t.k; apply(view);
}

function goTo(name) {
  if (!T[name]) return;

  }).join('');
  const out = M.rels.filter(r => r.parent === name), inc = M.rels.filter(r => r.child === name);
  const rl = r => `<li>Elke ${link(r.parent)} ${esc(r.verb)} <b>${CARD[r.child_card]}</b> ${link(r.child)}; elke ${esc(r.child)} hoort bij <b>${CARD[r.parent_card]}</b> ${esc(r.parent)}.<div class="card">${esc(r.child)}.${esc(r.column)} → ${esc(r.parent)} · ${r.identifying ? 'identificerend' : 'niet-identificerend'}</div></li>`;
  panel.innerHTML = `
    <button class="btn" type="button" data-home>← Overzicht</button>
    <h2 style="margin-top:14px">${esc(name)}</h2>
    <span class="chip"><i style="background:${d.color}"></i>${esc(d.label)}</span>
    <p style="margin-top:10px">${esc(t.desc)}</p>
    <h3>Attributen (${t.cols.length})</h3>
    <table class="attrs">${rows}</table>
    ${inc.length ? `<h3>Verwijst naar (${inc.length})</h3><ul class="rels">${inc.map(rl).join('')}</ul>` : ''}
    ${out.length ? `<h3>Wordt gebruikt door (${out.length})</h3><ul class="rels">${out.map(rl).join('')}</ul>` : ''}`;
  panel.scrollTop = 0;
}

function renderHome() {
  const counts = Object.keys(M.domains).map(k => [k, M.tables.filter(t => t.domain === k).length]);
  panel.innerHTML = `
    <h2>Over dit model</h2>
    <p>Eén datamodel voor alle zes afdelingen en de gedeelde basisgegevens. Elke relatie is als foreign key vastgelegd en het schema is foutloos in PostgreSQL geladen.</p>
    <div class="stats"><div><b>${M.tables.length}</b><span>entiteiten</span></div><div><b>${M.rels.length}</b><span>relaties</span></div><div><b>${M.tables.reduce((a, t) => a + t.cols.length, 0)}</b><span>attributen</span></div></div>
    <h3>Per afdeling</h3>
    <div class="domains">${counts.map(([k, n]) => `<button type="button" data-view="${k}"><span class="chip"><i style="background:${M.domains[k].color}"></i>${esc(M.domains[k].label)}</span><span class="n">${n}</span></button>`).join('')}</div>
    <h3>Wat is er verbeterd ten opzichte van 1.0</h3>
    <ol class="changes">${CHANGES.map(c => `<li>${c}</li>`).join('')}</ol>`;
}

// interactie: pan, zoom, klik
let drag = null; const pts = new Map(); let pinch = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.tools,.legend')) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; drag = null; return; }
  drag = { x: e.clientX, y: e.clientY, tx: tf[view].x, ty: tf[view].y, moved: false, target: e.target };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = stage.getBoundingClientRect();
    zoomAt(d / pinch.d, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch.d = d; return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; stage.classList.add('dragging'); }
  tf[view].x = drag.tx + dx; tf[view].y = drag.ty + dy; apply(view);
});
function up(e) {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (drag && !drag.moved) {
    const g = drag.target.closest && drag.target.closest('.tbl');
    if (g) goTo(g.dataset.name); else select(null);
  }
  drag = null; stage.classList.remove('dragging');
}
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
const mid = () => { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById('zin').onclick = () => zoomAt(1.25, ...mid());
document.getElementById('zout').onclick = () => zoomAt(0.8, ...mid());
document.getElementById('fit').onclick = () => fit(view);
panel.addEventListener('click', e => {
  const a = e.target.closest('[data-go]'); if (a) return goTo(a.dataset.go);
  const v = e.target.closest('[data-view]'); if (v) return show(v.dataset.view);
  if (e.target.closest('[data-home]')) select(null);
});
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim().toLowerCase();
  const hit = M.tables.find(t => t.name.toLowerCase() === q) || M.tables.find(t => t.name.toLowerCase().includes(q));
  if (hit) goTo(hit.name);
});
document.getElementById('q').addEventListener('change', e => { if (T[e.target.value]) goTo(e.target.value); });
window.addEventListener('resize', () => fit(view));

const start = (location.hash || '').slice(1);
show(VIEWS.includes(start) ? start : 'overview');
</script>
